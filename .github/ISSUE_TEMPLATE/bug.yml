name: Bug Report
description: Report something that is not working correctly
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the issue and what happened.
      placeholder: Tell us what went wrong...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Open...
        2. Click...
        3. Observe...
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, device, or other relevant details.
      placeholder: Chrome, Firefox, Mobile, Desktop...
    validations:
      required: false
