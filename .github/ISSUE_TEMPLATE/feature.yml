name: Feature Request
description: Suggest an improvement or new idea
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: Describe the feature or improvement.
      placeholder: What would you like to see added?
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why?
      description: Explain why this would be useful.
      placeholder: How would this improve the project?
    validations:
      required: false
